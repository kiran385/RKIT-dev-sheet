<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Record Paging</title>

    <!-- DevExtreme theme (v23.1.3) -->
    <link href="../Content/dx.dark.css" rel="stylesheet" />

    <!-- jQuery import -->
    <script src="../Scripts/jquery-3.5.1.min.js"></script>

    <!-- DevExtreme libraries (reference only one of them) -->
    <script src="../Scripts/dx.all.js"></script>
</head>
<body class="dx-viewport">
    <div id="gridContainer"></div>

    <script>
        $(() => {
            $('#gridContainer').dxDataGrid({
                dataSource: 'https://687f84e0efe65e52008a1051.mockapi.io/dummy/students',
                paging: {
                    pageSize: 15,
                    pageIndex: 0
                },
                pager: {
                    showNavigationButtons: true,
                    showPageSizeSelector: true,
                    allowedPageSizes: [10, 15, 20],
                    showInfo: true,
                    infoText: "Page {0} of {1} (Total {2} items)",
                    displayMode: "adaptive" //Full & Compact
                }
            });
        });
    </script>
</body>
</html>
