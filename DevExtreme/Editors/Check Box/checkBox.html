<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Check Box</title>

    <!-- jQuery import -->
    <script src="../Scripts/jquery-3.5.1.min.js"></script>

    <!-- DevExtreme theme (v23.1.3) -->
    <link rel="stylesheet" href="../Content/dx.dark.css">
    <!--<link href="https://cdnjs.cloudflare.com/ajax/libs/devextreme/23.1.3/css/dx.light.css" rel="stylesheet">-->

    <!-- DevExtreme libraries (reference only one of them) -->
    <script src="../Scripts/dx.all.js"></script>

</head>
<body class="dx-viewport">
    <h1>Check Box</h1>
    <div class="demo-container">
        <div class="form">
            <div class="dx-fieldset">
                <div class="dx-field">
                    <div class="dx-field-label">Checked</div>
                    <div class="dx-field-value">
                        <div id="checked"></div>
                    </div>
                </div>
                <div class="dx-field">
                    <div class="dx-field-label">Unchecked</div>
                    <div class="dx-field-value">
                        <div id="unchecked"></div>
                    </div>
                </div>
                <div class="dx-field">
                    <div class="dx-field-label">Indeterminate</div>
                    <div class="dx-field-value">
                        <div id="indeterminate"></div>
                    </div>
                </div>
                <div class="dx-field">
                    <div class="dx-field-label">Three state mode</div>
                    <div class="dx-field-value">
                        <div id="threeStateMode"></div>
                    </div>
                </div>
                <div class="dx-field">
                    <div class="dx-field-label">Handle value change</div>
                    <div class="dx-field-value">
                        <div id="handler"></div>
                    </div>
                </div>
                <div class="dx-field">
                    <div class="dx-field-label">Disabled</div>
                    <div class="dx-field-value">
                        <div id="disabled"></div>
                    </div>
                </div>
                <div class="dx-field">
                    <div class="dx-field-label">With label</div>
                    <div class="dx-field-value">
                        <div id="withText"></div>
                    </div>
                </div>
                <div class="dx-field">
                    <div class="dx-field-label">All Properties</div>
                    <div class="dx-field-value">
                        <div id="allProperties"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="checkBox.js"></script>
</body>
</html>
