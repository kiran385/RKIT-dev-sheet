<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Editors Full Demo</title>

    <!-- jQuery import -->
    <script src="../Scripts/jquery-3.5.1.min.js"></script>

    <!-- DevExtreme theme (v23.1.3) -->
    <link rel="stylesheet" href="../Content/dx.dark.css">
    <!--<link href="https://cdnjs.cloudflare.com/ajax/libs/devextreme/23.1.3/css/dx.light.css" rel="stylesheet">-->

    <!-- DevExtreme libraries (reference only one of them) -->
    <script src="../Scripts/dx.all.js"></script>

</head>
<body class="dx-viewport">
    <h1>Student Registration Form</h1>

    <div class="demo-container">
        <form id="form" action="your-action">
            <div class="dx-fieldset">
                <div class="dx-fieldset-header">Personal Information</div>
                <div class="dx-field">
                    <div class="dx-field-label">Full Name</div>
                    <div class="dx-field-value">
                        <div id="name"></div>
                    </div>
                </div>
                <div class="dx-field">
                    <div class="dx-field-label">Email</div>
                    <div class="dx-field-value">
                        <div id="email"></div>
                    </div>
                </div>
                <div class="dx-field">
                    <div class="dx-field-label">Date of birth</div>
                    <div class="dx-field-value">
                        <div id="dob"></div>
                    </div>
                </div>
                <div class="dx-field">
                    <div class="dx-field-label">Age</div>
                    <div class="dx-field-value">
                        <div id="age"></div>
                    </div>
                </div>
                <div class="dx-field">
                    <div class="dx-field-label">Gender</div>
                    <div class="dx-field-value">
                        <div id="gender"></div>
                    </div>
                </div>
            </div>

            <div class="dx-fieldset">
                <div class="dx-fieldset-header">Other</div>
                <div class="dx-field">
                    <div class="dx-field-label">City</div>
                    <div class="dx-field-value">
                        <div id="city"></div>
                    </div>
                </div>
                <div class="dx-field">
                    <div class="dx-field-label">About you</div>
                    <div class="dx-field-value">
                        <div id="about"></div>
                    </div>
                </div>
                <div class="dx-field">
                    <div class="dx-field-label">Profile Picture</div>
                    <div class="dx-field-value">
                        <div id="profile"></div>
                    </div>
                </div>
                <div class="dx-field">
                    <div class="dx-field-label">Password</div>
                    <div class="dx-field-value">
                        <div id="password"></div>
                    </div>
                </div>
                <div class="dx-field">
                    <div class="dx-field-label">Confirm Password</div>
                    <div class="dx-field-value">
                        <div id="confirmPassword"></div>
                    </div>
                </div>
            </div>


            <div class="dx-fieldset">
                <div class="dx-field">
                    <div class="dx-field-label">
                        <div id="check"></div>
                    </div>
                    <div class="dx-field-value">
                        <div id="button"></div>
                    </div>
                </div>
                <div id="summary"></div>
            </div>
        </form>
    </div>

    <script src="demo.js"></script>
</body>
</html>
