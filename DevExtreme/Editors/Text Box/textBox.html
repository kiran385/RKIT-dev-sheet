<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Text Box</title>

    <!-- jQuery import -->
    <script src="../Scripts/jquery-3.5.1.min.js"></script>

    <!-- DevExtreme theme (v23.1.3) -->
    <link rel="stylesheet" href="../Content/dx.dark.css">
    <!--<link href="https://cdnjs.cloudflare.com/ajax/libs/devextreme/23.1.3/css/dx.light.css" rel="stylesheet">-->

    <!-- DevExtreme libraries (reference only one of them) -->
    <script src="../Scripts/dx.all.js"></script>

</head>
<body class="dx-viewport">
    <h1>Text Box</h1>

    <div class="demo-container">
        <div class="form">
            <div class="dx-fieldset">
                <div class="dx-field">
                    <!-- Label for Name field -->
                    <div class="dx-field-label">Name</div>

                    <!-- Placeholder for Name input -->
                    <div class="dx-field-value">
                        <div id="placeholder"></div>
                    </div>
                </div>
                <div class="dx-field">
                    <!-- Label for Password field -->
                    <div class="dx-field-label">Password</div>

                    <!-- Placeholder for Password input -->
                    <div class="dx-field-value">
                        <div id="password"></div>
                    </div>
                </div>
                <div class="dx-field">
                    <!-- Label for Mobile No. field -->
                    <div class="dx-field-label">Mobile No.</div>

                    <!-- Placeholder for Mobile No. input -->
                    <div class="dx-field-value">
                        <div id="mobile-no"></div>
                    </div>
                </div>
            </div>
            <div class="dx-fieldset">
                <div class="dx-fieldset-header">Events</div>
                <div class="dx-field">
                    <!-- Label for Full Name field in Events section -->
                    <div class="dx-field-label">Full Name</div>

                    <!-- Placeholder for Full Name input in Events section -->
                    <div class="dx-field-value">
                        <div id="full-name"></div>
                    </div>
                </div>
                <div class="dx-field">
                    <!-- Label for Email field -->
                    <div class="dx-field-label">Email (read only)</div>

                    <!-- Placeholder for Email input -->
                    <div class="dx-field-value">
                        <div id="email"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="textBox.js"></script>
</body>
</html>
