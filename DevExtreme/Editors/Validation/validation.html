<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Validation</title>

    <!-- jQuery import -->
    <script src="../Scripts/jquery-3.5.1.min.js"></script>

    <!-- DevExtreme theme (v23.1.3) -->
    <link rel="stylesheet" href="../Content/dx.dark.css">
    <!--<link href="https://cdnjs.cloudflare.com/ajax/libs/devextreme/23.1.3/css/dx.light.css" rel="stylesheet">-->

    <!-- DevExtreme libraries (reference only one of them) -->
    <script src="../Scripts/dx.all.js"></script>

</head>
<body class="dx-viewport">
    <h1>Validation</h1>

    <div class="demo-container">
        <form id="form" action="your-action">
            <div class="dx-fieldset">
                <div class="dx-fieldset-header">Credentials</div>
                <div class="dx-field">
                    <div class="dx-field-label">Email</div>
                    <div class="dx-field-value">
                        <div id="email-validation"></div>
                    </div>
                </div>
                <div class="dx-field">
                    <div class="dx-field-label">Password</div>
                    <div class="dx-field-value">
                        <div id="password-validation"></div>
                    </div>
                </div>
                <div class="dx-field">
                    <div class="dx-field-label">Confirm Password</div>
                    <div class="dx-field-value">
                        <div id="confirm-password-validation"></div>
                    </div>
                </div>
            </div>
            <div class="dx-fieldset">
                <div class="dx-fieldset-header">Personal Data</div>
                <div class="dx-field">
                    <div class="dx-field-label">Name</div>
                    <div class="dx-field-value">
                        <div id="name-validation"></div>
                    </div>
                </div>
                <div class="dx-field">
                    <div class="dx-field-label">Date of birth</div>
                    <div class="dx-field-value">
                        <div id="date-validation"></div>
                    </div>
                </div>
            </div>
            <div class="dx-fieldset">
                <div class="dx-fieldset-header">Billing address</div>
                <div class="dx-field">
                    <div class="dx-field-label">Country</div>
                    <div class="dx-field-value">
                        <div id="country-validation"></div>
                    </div>
                </div>
                <div class="dx-field">
                    <div class="dx-field-label">City</div>
                    <div class="dx-field-value">
                        <div id="city-validation"></div>
                    </div>
                </div>
                <div class="dx-field">
                    <div class="dx-field-label">Address</div>
                    <div class="dx-field-value">
                        <div id="address-validation"></div>
                    </div>
                </div>
                <div class="dx-field">
                    <div class="dx-field-label">Phone <i>(optional)</i></div>
                    <div class="dx-field-value">
                        <div id="phone-validation"></div>
                    </div>
                </div>
            </div>
            <div class="dx-fieldset">
                <div class="dx-field">
                    <div class="dx-field-label">
                        <div id="check"></div>
                    </div>
                    <div class="dx-field-value">
                        <div id="button"></div>
                    </div>
                </div>
                <div id="summary"></div>
            </div>
        </form>
    </div>
    
    <script src="validation.js"></script>
</body>
</html>
