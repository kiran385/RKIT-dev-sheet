<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Text Area</title>

    <!-- jQuery import -->
    <script src="../Scripts/jquery-3.5.1.min.js"></script>

    <!-- DevExtreme theme (v23.1.3) -->
    <link rel="stylesheet" href="../Content/dx.dark.css">
    <!--<link href="https://cdnjs.cloudflare.com/ajax/libs/devextreme/23.1.3/css/dx.light.css" rel="stylesheet">-->

    <!-- DevExtreme libraries (reference only one of them) -->
    <script src="../Scripts/dx.all.js"></script>

</head>
<body class="dx-viewport">
    <h1>Text Area</h1>

    <div class="demo-container">
        <div class="dx-fieldset">
            <div class="dx-fieldset-header">Default Mode</div>
            <div class="dx-field">
                <div id="set-max-length"></div>
            </div>
            <div class="dx-field">
                <div id="set-resize"></div>
            </div>
        </div>

        <div class="textarea-wrapper">
            <div id="example-textarea"></div>
        </div>

        <div class="full-width-content">
            <div class="dx-fieldset">
                <div class="dx-fieldset-header">Event Handling and API</div>
                <div class="dx-field">
                    <div class="dx-field-label">Synchronize text areas </div>
                    <div class="dx-field-value">
                        <div id="change-event"></div>
                    </div>
                </div>
            </div>
            <div class="textarea-wrapper">
                <div id="editing-textarea"></div>
                <div id="disabled-textarea"></div>
            </div>
        </div>
    </div>

    <script src="textArea.js"></script>
</body>
</html>
