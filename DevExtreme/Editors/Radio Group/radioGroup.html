<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Radio Group</title>

    <!-- jQuery import -->
    <script src="../Scripts/jquery-3.5.1.min.js"></script>

    <!-- DevExtreme theme (v23.1.3) -->
    <link rel="stylesheet" href="../Content/dx.dark.css">
    <!--<link href="https://cdnjs.cloudflare.com/ajax/libs/devextreme/23.1.3/css/dx.light.css" rel="stylesheet">-->

    <!-- DevExtreme libraries (reference only one of them) -->
    <script src="../Scripts/dx.all.js"></script>

    <style>
        .low.dx-radiobutton-checked .dx-radiobutton-icon .dx-radiobutton-icon-dot {
            background: gray;
        }

        .normal.dx-radiobutton-checked .dx-radiobutton-icon .dx-radiobutton-icon-dot {
            background: green;
        }

        .urgent.dx-radiobutton-checked .dx-radiobutton-icon .dx-radiobutton-icon-dot {
            background: orange;
        }

        .high.dx-radiobutton-checked .dx-radiobutton-icon .dx-radiobutton-icon-dot {
            background: red;
        }
    </style>
</head>
<body class="dx-viewport">
    <h1>Radio Group</h1>

    <h2>Normal Radio Group</h2>
    <div id="radioGroup"></div>
    <h2>Custom Radio Group with different color</h2>
    <div id="customRadioGroup"></div>

    <script src="radioGroup.js"></script>
</body>
</html>
