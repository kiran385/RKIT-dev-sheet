<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Select Box</title>

    <!-- jQuery import -->
    <script src="../Scripts/jquery-3.5.1.min.js"></script>

    <!-- DevExtreme theme (v23.1.3) -->
    <link rel="stylesheet" href="../Content/dx.dark.css">
    <!--<link href="https://cdnjs.cloudflare.com/ajax/libs/devextreme/23.1.3/css/dx.light.css" rel="stylesheet">-->

    <!-- DevExtreme libraries (reference only one of them) -->
    <script src="../Scripts/dx.all.js"></script>

</head>
<body class="dx-viewport">
    <h1>Select Box</h1>

    <div class="demo-container">
        <div id="form">
            <div class="dx-fieldset">
                <div class="dx-field">
                    <div class="dx-field-label">Default mode</div>
                    <div class="dx-field-value">
                        <div id="products-simple"></div>
                    </div>
                </div>
                <div class="dx-field">
                    <div class="dx-field-label">With a custom placeholder</div>
                    <div class="dx-field-value">
                        <div id="products-placeholder"></div>
                    </div>
                </div>
                <div class="dx-field">
                    <div class="dx-field-label">Disabled</div>
                    <div class="dx-field-value">
                        <div id="products-disabled"></div>
                    </div>
                </div>
                <div class="dx-field">
                    <div class="dx-field-label">Data source usage</div>
                    <div class="dx-field-value">
                        <div id="products-data-source"></div>
                    </div>
                </div>
            </div>
            <div class="dx-fieldset">
                <div class="dx-fieldset-header">Grouping</div>
                <div class="dx-field">
                    <div class="dx-field-label">Fruits and Vegetables</div>
                    <div class="dx-field-value">
                        <div id="selectBoxContainer"></div>
                    </div>
                </div>
            </div>
            <div class="dx-fieldset">
                <div class="dx-fieldset-header">Event Handling</div>
                <div class="dx-field">
                    <div class="dx-field-label">Product</div>
                    <div class="dx-field-value">
                        <div id="product-handler"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="selectBox.js"></script>
</body>
</html>
