<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>CustomStore</title>

    <!-- jQuery import -->
    <script src="../Scripts/jquery-3.5.1.min.js"></script>

    <!-- DevExtreme theme (v23.1.3) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/devextreme/23.1.3/css/dx.dark.css" rel="stylesheet">

    <!-- DevExtreme libraries (reference only one of them) -->
    <script src="../Scripts/dx.all.js"></script>

</head>
<body class="dx-viewport">
    <!-- Form for adding/updating -->
    <div id="formContainer" style="display:none;">
        <input type="text" id="name" placeholder="Name">
        <input type="number" id="number" placeholder="Mobile Number">
        <input type="number" id="age" placeholder="Age">
        <input type="text" id="address" placeholder="Address">
        <input type="number" id="roomNumber" placeholder="Room Number">
        <input type="text" id="feesPaid" placeholder="Fees Paid">
        <button id="saveButton">Save</button>
        <button id="cancelButton">Cancel</button>
    </div>
    <button id="addButton">Add New</button><br />
    <table id="dataTable" border="1">
        <thead>
            <tr>
                <th>Name</th>
                <th>Mobile Number</th>
                <th>Age</th>
                <th>Address</th>
                <th>Room Number</th>
                <th>Fees Paid</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <!-- Data rows will be inserted here -->
        </tbody>
    </table>

    <script src="customStore.js"></script>
</body>
</html>
